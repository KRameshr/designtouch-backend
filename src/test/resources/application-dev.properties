# Test-classpath overrides for SpringBootTest classes using the dev profile.
# Require an explicitly supplied test database so tests cannot inherit the
# ignored main dev resource's Neon URL and username by accident.
app.jwt.secret=test-only-jwt-signing-key-do-not-use-in-production-0123456789abcdef
spring.datasource.url=${TEST_DATABASE_URL}
spring.datasource.username=${TEST_DATABASE_USERNAME}
spring.datasource.password=${TEST_DATABASE_PASSWORD}

# Bound any test-database JDBC attempts and prevent test-triggered migrations.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=15
spring.flyway.enabled=false
logging.level.com.zaxxer.hikari=INFO
