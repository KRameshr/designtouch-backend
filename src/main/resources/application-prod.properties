# Production configuration: these values are intentionally required.
# Deployment platform must provide each variable; missing values stop startup.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Bound network connect time while allowing Hikari time to attempt initialization.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.connectTimeout=10
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.boot.autoconfigure.jdbc=INFO
app.jwt.secret=${JWT_SECRET}
