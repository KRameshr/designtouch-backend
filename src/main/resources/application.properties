# ==========================================
# Server
# ==========================================
server.port=${PORT:8080}
spring.application.name=designtouch-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================================
# Database (Neon PostgreSQL)
# Set these as environment variables in production (Render/Railway).
# For local dev, create application-dev.properties (gitignored) with real values,
# or export them in your shell before running.
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/designtouch}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HikariCP tuning for Neon (serverless Postgres)
# Neon's free tier suspends the compute after ~5 min idle. The next connection
# has to wait for it to "wake up" (can take several seconds), and Neon's
# pooler also recycles connections more aggressively than Hikari's defaults
# expect. Without these settings, the app can fail to start with
# "This connection has been closed" during a cold start.
# ==========================================
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=60000

# ==========================================
# JPA / Hibernate
# ddl-auto=validate in production — Flyway owns schema changes, Hibernate should
# never auto-alter tables. This catches mismatches between entities and schema early.
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Flyway migrations
# Only the base folder runs here — no seed/sample data. The "dev" profile
# adds an extra location (db/migration/dev) for local-only seed data, see
# application-dev.properties.
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# CORS — frontend origin (update after Vercel deploy)
# ==========================================
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# ==========================================
# JWT (admin auth)
# IMPORTANT: override app.jwt.secret via environment variable in production.
# Generate one with: openssl rand -base64 64
# ==========================================
app.jwt.secret=${JWT_SECRET:change-this-in-production-use-a-real-64-char-secret-key-here}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# File upload limits (media & video uploads before Cloudinary upload)
# ==========================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.media.max-video-size-bytes=${MAX_VIDEO_SIZE_BYTES:104857600}
app.media.video-folder=${CLOUDINARY_VIDEO_FOLDER:designtouch/videos}

# ==========================================
# Cloudinary (Media storage & video hosting)
# Set via environment variables in production.
# For local dev, override in application-dev.properties (gitignored).
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

